app-id: co.rbel.routeboy
branch: stable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: routeboy

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=x11
  - --device=dri
  - --filesystem=~/Tracks:ro

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    CGO_ENABLED: '1'
    GOTOOLCHAIN: local
    GOPROXY: 'off'
    GOWORK: 'off'

modules:
  - name: routeboy
    buildsystem: simple
    build-commands:
      - go build -mod=vendor -tags=flatpak,no_metadata,migrated_fynedo -trimpath -buildvcs=false -ldflags='-s -w' -o routeboy .
      - install -Dm755 routeboy ${FLATPAK_DEST}/bin/routeboy
      - install -Dm644 assets/${FLATPAK_ID}.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 assets/${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 assets/${FLATPAK_ID}.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 LICENSE ${FLATPAK_DEST}/share/licenses/routeboy/LICENSE
    sources:
      - type: archive
        path: routeboy-source.tar.gz
